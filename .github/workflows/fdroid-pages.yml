name: Publish F-Droid repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag; leave empty for the latest release
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/fdroid-pages.yml
      - scripts/fdroid/**
      - packaging/repository/**

permissions:
  contents: read

concurrency:
  group: fdroid-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install repository tools
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          python3 -m venv "$RUNNER_TEMP/fdroid-venv"
          "$RUNNER_TEMP/fdroid-venv/bin/pip" install -r scripts/fdroid/requirements.txt
          echo "$RUNNER_TEMP/fdroid-venv/bin" >> "$GITHUB_PATH"
      - name: Check publisher input validation
        run: python -m unittest discover -s scripts/fdroid/tests -v
      - name: Generate and verify signed repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          FDROID_REPO_KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
          FDROID_REPO_PASSWORD: ${{ secrets.FDROID_REPO_PASSWORD }}
        run: |
          python scripts/fdroid/build_repository.py --work "$RUNNER_TEMP/fdroid-private" --output "$RUNNER_TEMP/fdroid-site"
      - name: Upload public repository only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/fdroid-site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed repository
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
